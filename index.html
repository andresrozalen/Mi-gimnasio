'use strict';const KEY='mi-gimnasio-v1';const names=['Pecho','Espalda','Bíceps','Tríceps','Hombro','Pierna'];const icons={'Pecho':'01','Espalda':'02','Bíceps':'03','Tríceps':'04','Hombro':'05','Pierna':'06'};const seed=[['Pecho','Pure Strength Incline Chest Press',40,60,2.5,150],['Pecho','Pure Strength Wide Chest Press',40,70,2.5,150],['Pecho','Pure Strength Chest Press',30,60,2.5,150],['Tríceps','Polea alta',15,22.5,2.5,90],['Tríceps','Pure Strength Seated Dip',40,60,2.5,120],['Espalda','Pure Strength Row',40,60,2.5,150],['Espalda','Pure Strength Low Row',20,30,2.5,120],['Espalda','Pure Strength Pulldown',60,70,2.5,150],['Bíceps','Pure Strength Bíceps',15,20,2.5,90],['Bíceps','Martillo mancuernas (kg por mancuerna)',10,10,1,90],['Bíceps','Bayesian Curl',10,12,1,90],['Hombro','Pure Strength Shoulder Press',20,25,2.5,150]];const initial=()=>({version:1,exercises:seed.map((s,i)=>({id:'e'+i,group:s[0],name:s[1],min:s[2],max:s[3],step:s[4],rest:s[5],notes:s[1].includes('Bíceps')?'Vigilar fatiga y técnica.':''})),sessions:[]});let storageReadFailed=false;let storageSnapshot=null;let db;try{storageSnapshot=localStorage.getItem(KEY);db=JSON.parse(storageSnapshot)||initial();db=validateDB(db)}catch(e){db=initial();storageReadFailed=true;setTimeout(()=>notice('No se pudieron leer tus datos. No se sobrescribirán. Exporta el archivo de recuperación desde Ajustes o restaura una copia válida.'),0)}let page='home',group='',exId='',draft=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('No se pudo guardar. Comprueba el espacio disponible y exporta una copia de seguridad.');return false}};const ex=()=>db.exercises.find(e=>e.id===exId);const logs=id=>db.sessions.filter(s=>s.exerciseId===id).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);const fmt=d=>d?d.split('-').reverse().join('/'):'—';const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const app=()=> $('app');function go(p,g='',id=''){page=p;group=g||group;exId=id||exId;draft=null;render();scrollTo(0,0)}function head(label,title){return `<div class="top"><div><div class="eyebrow">${esc(label)}</div><h1>${esc(title)}</h1></div><div class="brandmark" aria-hidden="true">MG</div></div>`}function back(p,g){return `<button class="back" onclick="go('${p}','${g||''}')">← Volver</button>`}function render(){if(page==='home')return home();if(page==='group')return groups();if(page==='exercise')return exercise();if(page==='stats')return stats();if(page==='settings')return settings();if(page==='new')return newExercise();}function home(){app().innerHTML=head('Entrenamiento personal','Mi Gimnasio')+`<p class="muted">Elige qué músculo entrenas hoy. Sin días fijos.</p><div class="tilegrid">`+names.map(n=>`<button class="tile" onclick="go('group','${n}')"><div class="icon">${icons[n]}</div><strong>${n}</strong><span>${db.exercises.filter(e=>e.group===n).length} ${db.exercises.filter(e=>e.group===n).length===1?'ejercicio':'ejercicios'}</span></button>`).join('')+`</div><div class="card spaced"><b>Última actividad</b><p class="muted small">${db.sessions.length?esc(db.sessions.slice().sort((a,b)=>b.created-a.created)[0].date)+' · '+esc(db.exercises.find(e=>e.id===db.sessions.slice().sort((a,b)=>b.created-a.created)[0].exerciseId)?.name||'Ejercicio eliminado'):'Todavía no hay entrenamientos registrados.'}</p></div>`}function groups(){app().innerHTML=back('home')+head('Grupo muscular',group)+db.exercises.filter(e=>e.group===group).map(e=>{const last=logs(e.id)[0];return `<button class="item" onclick="go('exercise','${group}','${e.id}')"><div><b>${esc(e.name)}</b><small>${last?'Última: '+fmt(last.date)+' · '+last.sets.map(s=>s.kg+' kg').join(' / '):'Sin registros todavía'}</small></div><span>›</span></button>`}).join('')+`<button class="btn full spaced" onclick="go('new','${group}')">＋ Añadir ejercicio</button>`}function chart(log){let pts=log.filter(s=>Number.isFinite(+s.sets[3]?.kg)&&s.sets[3]?.kg!==''&&+s.sets[3].reps>0).slice(0,15).reverse();if(pts.length<2)return '<p class="hint">La gráfica aparecerá cuando registres al menos dos sesiones.</p>';let vals=pts.map(s=>+s.sets[3].kg),min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;let xy=vals.map((v,i)=>[24+i*(280/(vals.length-1)),125-(v-min)/range*95]);return `<svg class="chart" viewBox="0 0 330 160" role="img" aria-label="Evolución de kilos de la cuarta serie"><path d="M24 30 V130 H310" stroke="#637b9d" fill="none"/><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#82b8ff" stroke-width="3"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#90f0c1"/>`).join('')}<text x="4" y="23">${max} kg</text><text x="4" y="145">${min} kg</text></svg>`}function exercise(){let e=ex();if(!e)return go('home');let ls=logs(e.id),last=ls[0],best=ls.flatMap(s=>s.sets.filter(x=>+x.reps>0).map(x=>+x.kg)).filter(Number.isFinite);let record=best.length?Math.max(...best):null;let lastStatus=last?recommend(last):null;app().innerHTML=back('group',e.group)+head(e.group,e.name)+`<div class="card"><div class="row"><span class="pill">Descanso ${formatRest(e.rest)}</span></div><div class="row spaced"><div><div class="muted small">Mayor carga registrada</div><div class="stat">${record===null?'—':record+' kg'}</div></div><div><div class="muted small">Registros</div><div class="stat">${ls.length}</div></div></div><p class="hint">${esc(e.notes)}</p></div>`+ (last?`<div class="card"><div class="row"><b>Última sesión</b><span class="muted small">${fmt(last.date)}</span></div><p class="muted small">${last.sets.map((s,i)=>`${[12,10,8,6][i]} objetivo: ${s.kg} kg × ${s.reps}`).join(' · ')}</p><span class="tag ${lastStatus==='REVISAR'?'warning':''}">${lastStatus}</span></div>`:'')+`<div class="card" id="registro"><h3 id="recordtitle">Registrar entrenamiento</h3><div class="field"><label for="date">Fecha</label><input id="date" type="date" value="${today()}"></div><div class="series"><div></div><div class="head">Peso (kg)</div><div class="head">Reps reales</div>${[12,10,8,6].map((r,i)=>`<div class="target"><small>S${i+1}</small>${r}</div><input aria-label="Peso de la serie ${i+1}, objetivo ${r} repeticiones" inputmode="decimal" type="number" min="0" step="any" id="kg${i}" placeholder="kg" value="${last?last.sets[i].kg:''}"><input aria-label="Repeticiones de la serie ${i+1}, objetivo ${r}" inputmode="numeric" type="number" min="0" step="1" id="reps${i}" placeholder="reps">`).join('')}</div><details class="rest-inline"><summary>Descanso entre series · ${e.rest} s</summary><div id="timer"></div></details><div class="field"><label for="tech">Técnica</label><select id="tech"><option value="OK">Correcta</option><option value="Revisar">Necesita mejorar / molestias</option></select></div><div class="field"><label for="effort">Esfuerzo última serie</label><select id="effort"><option value="Límite">Al límite / fallo</option><option value="Controlado">Quedaba al menos 1 repetición</option></select></div><div class="field"><label for="note">Sensaciones / notas</label><textarea id="note" placeholder="Opcional"></textarea></div><button id="saverecord" class="btn full" onclick="addSession()">Guardar entrenamiento</button><button id="canceledit" class="btn secondary full spaced hidden" onclick="cancelEdit()">Cancelar edición</button><p class="hint">El borrador se conserva al navegar por la app. Guarda antes de cerrar esta pestaña.</p><p class="hint">El aviso SUBIR es conservador: exige completar las cuatro metas con buena técnica y al menos una repetición en reserva. No es una obligación de aumentar la carga.</p></div><details class="card"><summary>Evolución de la cuarta serie</summary>${chart(ls)}</details><details class="card" id="history-panel"><summary>Historial · ${ls.length} ${ls.length===1?'registro':'registros'}</summary>${historyCards(ls)}</details><button class="btn secondary full" onclick="editExercise()">Editar ejercicio</button>`}function recommend(s){if(s.tech==='Revisar')return 'REVISAR';return s.sets.every((x,i)=>+x.reps>=[12,10,8,6][i])&&s.effort==='Controlado'?'SUBIR':'MANTENER'}async function addSession(){const date=$('date').value,sets=[0,1,2,3].map(i=>({kg:Number($('kg'+i).value),reps:Number($('reps'+i).value)}));if(!date||sets.some((s,i)=>$('kg'+i).value===''||$('reps'+i).value===''||s.kg<0||!Number.isInteger(s.reps)||s.reps<0)){alert('Completa fecha, pesos y repeticiones reales de las cuatro series.');return}let s={id:'s'+Date.now(),exerciseId:exId,date,sets,tech:$('tech').value,effort:$('effort').value,note:$('note').value,created:Date.now()};db.sessions.push(s);if(save()){alert('Entrenamiento guardado · '+recommend(s)+(recommend(s)==='SUBIR'?' · Próxima sesión: valora subir '+ex().step+' kg.':''));render()}}function newExercise(edit=false){let e=edit?ex():null;app().innerHTML=back(edit?'exercise':'group',group)+head(edit?'Editar ficha':'Nueva ficha',edit?'Editar ejercicio':'Añadir ejercicio')+`<div class="card"><div class="field"><label>Nombre</label><input id="newname" value="${esc(e?.name||'')}"></div><div class="field"><label>Grupo</label><select id="newgroup">${names.map(n=>`<option ${n===(e?.group||group)?'selected':''}>${n}</option>`).join('')}</select></div><div class="row"><div class="field"><label>Incremento (kg)</label><input id="newstep" type="number" inputmode="decimal" step="any" value="${e?.step??2.5}"></div><div class="field"><label>Descanso (segundos)</label><input id="newrest" type="number" inputmode="numeric" value="${e?.rest??120}"></div></div><div class="field"><label>Notas de técnica</label><textarea id="newnotes">${esc(e?.notes||'')}</textarea></div><button class="btn full" onclick="storeExercise(${edit})">Guardar ejercicio</button></div>`}function editExercise(){page='new';newExercise(true)}async function storeExercise(edit){let name=$('newname').value.trim(),min=+$('newmin').value,max=+$('newmax').value,step=+$('newstep').value,rest=+$('newrest').value;if(!name||!Number.isFinite(min)||!Number.isFinite(max)||min<0||max<min||step<=0||rest<0){alert('Revisa nombre, pesos, incremento y descanso.');return}let obj={id:edit?exId:'e'+Date.now(),group:$('newgroup').value,name,min,max,step,rest,notes:$('newnotes').value};if(edit){Object.assign(ex(),obj)}else db.exercises.push(obj);if(save())go('exercise',obj.group,obj.id)}function stats(){let counts=db.sessions.length;app().innerHTML=head('Tu evolución','Resumen')+`<div class="tilegrid"><div class="card"><div class="muted small">Registros de ejercicio</div><div class="stat">${counts}</div></div><div class="card"><div class="muted small">Ejercicios disponibles</div><div class="stat">${db.exercises.length}</div></div></div><h2 class="spaced">Por ejercicio</h2>`+db.exercises.map(e=>{let l=logs(e.id),best=l.flatMap(s=>s.sets.filter(x=>x.reps>0).map(x=>x.kg));return `<button class="item" onclick="go('exercise','${e.group}','${e.id}')"><div><b>${esc(e.name)}</b><small>${l.length} ${l.length===1?'registro':'registros'} · mayor carga ${best.length?Math.max(...best)+' kg':'—'}</small></div><span>›</span></button>`}).join('')}function settings(){app().innerHTML=head('Tus datos','Ajustes')+`<div class="card"><h3>Copias de seguridad</h3><p class="hint">Exporta periódicamente un archivo JSON a Archivos/iCloud Drive. Para cambiar de iPhone, importa ese archivo. Los datos locales pueden desaparecer si borras los datos de Safari o eliminas la web app.</p><button class="btn full" onclick="backup()">↓ Exportar copia JSON</button><div class="field"><label for="importfile">Restaurar copia JSON</label><input id="importfile" type="file" accept=".json,application/json" onchange="restore(this)"></div><p class="hint">Restaurar reemplaza todos los ejercicios y sesiones actuales. Exporta antes una copia.</p></div><div class="card"><h3>Instalar en iPhone</h3><p class="hint">Una vez publicada en HTTPS, abre la dirección en Safari, pulsa Compartir y selecciona «Añadir a pantalla de inicio».</p></div><div class="card"><h3>Privacidad</h3><p class="hint">No hay cuentas ni envío de entrenamientos a un servidor. El historial permanece en el almacenamiento del navegador donde utilices la app.</p></div>`}function backup(){const data=JSON.stringify(db,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-gimnasio-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function restore(inp){const file=inp.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.exercises)||!Array.isArray(data.sessions)||data.exercises.some(e=>typeof e.id!=='string'||typeof e.name!=='string'||!names.includes(e.group))||data.sessions.some(s=>typeof s.exerciseId!=='string'||!Array.isArray(s.sets)||s.sets.length!==4))throw Error('Formato incorrecto');if(!confirm('¿Reemplazar TODOS los datos actuales por esta copia?'))return;let old=db;db=data;if(save()){alert('Copia restaurada');go('home')}else db=old}catch(e){alert('No se pudo importar: archivo incompatible o dañado.')}}
function newId(){if(crypto.randomUUID)return crypto.randomUUID();const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
function formatRest(seconds){return seconds<60?seconds+' s':Math.floor(seconds/60)+' min'+(seconds%60?' '+seconds%60+' s':'')}
function validateDB(data){
 const fail=()=>{throw Error('La copia contiene datos incompletos o no válidos. No se ha cambiado tu historial.')};
 const text=(v,max)=>typeof v==='string'&&v.length<=max;
 const id=v=>typeof v==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(v);
 const num=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1000000;
 const date=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&Number.isFinite(Date.parse(v+'T12:00:00Z'))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v;
 if(!data||data.version!==1||!Array.isArray(data.exercises)||!Array.isArray(data.sessions)||data.exercises.length>5000||data.sessions.length>100000)fail();
 const ids=new Set(),sids=new Set();
 const exercises=data.exercises.map(e=>{if(!e||!id(e.id)||ids.has(e.id)||!text(e.name,200)||!e.name.trim()||!names.includes(e.group)||![e.min,e.max,e.step,e.rest].every(num)||e.max<e.min||e.step<=0||!Number.isInteger(e.rest)||e.rest>86400||!text(e.notes??'',5000))fail();ids.add(e.id);return {id:e.id,group:e.group,name:e.name,min:e.min,max:e.max,step:e.step,rest:e.rest,notes:e.notes??''}});
 function session(s){if(!s||!id(s.id)||sids.has(s.id)||!ids.has(s.exerciseId)||!date(s.date)||!Array.isArray(s.sets)||s.sets.length!==4||s.sets.some(x=>!x||!num(x.kg)||!num(x.reps)||!Number.isInteger(x.reps))||!['OK','Revisar'].includes(s.tech)||!['Límite','Controlado'].includes(s.effort)||!text(s.note??'',10000)||typeof s.created!=='number'||!Number.isFinite(s.created)||s.created<0)fail();sids.add(s.id);return {id:s.id,exerciseId:s.exerciseId,date:s.date,sets:s.sets.map(x=>({kg:x.kg,reps:x.reps})),tech:s.tech,effort:s.effort,note:s.note??'',created:s.created}}
 if(data.trash!==undefined&&!Array.isArray(data.trash))fail();
 return {version:1,exercises,sessions:data.sessions.map(session),trash:(data.trash??[]).map(session)};
}
function notice(message){let el=$('notice');if(!el){el=document.createElement('div');el.id='notice';el.className='notice';el.setAttribute('role','status');document.body.append(el)}el.replaceChildren();let span=document.createElement('span');span.textContent=message;el.append(span);let b=document.createElement('button');b.textContent='Cerrar';b.onclick=()=>el.remove();el.append(b)}
function ask(message){return new Promise(resolve=>{let d=document.createElement('dialog');let p=document.createElement('p');p.textContent=message;d.append(p);let row=document.createElement('div');row.className='actions';for(let [label,value] of [['Cancelar',false],['Continuar',true]]){let b=document.createElement('button');b.className='btn '+(value?'':'secondary');b.textContent=label;b.onclick=()=>{d.close();d.remove();resolve(value)};row.append(b)}d.append(row);d.addEventListener('cancel',()=>{d.remove();resolve(false)});document.body.append(d);d.showModal()})}
const clone=v=>JSON.parse(JSON.stringify(v));
function showConflict(){captureDraft();notice('Otra pestaña ha cambiado los datos. No se ha sobrescrito nada. Actualiza y revisa tu borrador antes de guardar.');const b=document.createElement('button');b.textContent='Actualizar datos';b.onclick=()=>location.reload();$('notice').append(b)}
async function commit(next,{restore=false}={}){
 const write=()=>{try{next=validateDB(next);if(storageReadFailed&&!restore){notice('Los datos anteriores no se pudieron leer. Descarga la recuperación en Ajustes antes de restaurar una copia válida.');return false}
 const raw=localStorage.getItem(KEY);if(raw!==storageSnapshot){showConflict();return false}
 const serialized=JSON.stringify(next);if(raw)localStorage.setItem(KEY+'-anterior',raw);localStorage.setItem(KEY,serialized);storageSnapshot=serialized;db=next;storageReadFailed=false;return true
 }catch(e){notice('No se han guardado los cambios. '+(e.message||'Comprueba el almacenamiento disponible.'));return false}};
 try{return navigator.locks?await navigator.locks.request(KEY+'-write',{mode:'exclusive'},write):write()}catch{notice('No se ha podido guardar. Tus datos anteriores se conservan.');return false}
}
window.addEventListener('storage',event=>{if(event.key===KEY&&event.newValue!==storageSnapshot)showConflict()});

let editingSession=null,editingExercise=false,draftStore={};
try{draftStore=JSON.parse(sessionStorage.getItem(KEY+'-drafts')||'{}');if(!draftStore||typeof draftStore!=='object')draftStore={}}catch{}
const draftKey=()=>page==='exercise'?'session-'+exId:page==='new'?'exercise-'+(editingExercise?exId:'new-'+group):null;
function captureDraft(){const key=draftKey();if(!key)return;const vals={};app().querySelectorAll('input:not([type=file]),select,textarea').forEach(el=>{if(el.id)vals[el.id]=el.value});if(!Object.keys(vals).length)return;draftStore[key]={values:vals,editingSession};try{sessionStorage.setItem(KEY+'-drafts',JSON.stringify(draftStore))}catch{notice('No se pudo conservar el borrador. Guarda el registro antes de salir.')}}
function clearDraft(){const k=draftKey();if(k)delete draftStore[k];try{sessionStorage.setItem(KEY+'-drafts',JSON.stringify(draftStore))}catch{}}
function applyDraft(){const d=draftStore[draftKey()];if(d&&d.values){for(const [id,value]of Object.entries(d.values)){const el=$(id);if(el&&typeof value==='string')el.value=value}editingSession=d.editingSession&&db.sessions.some(s=>s.id===d.editingSession&&s.exerciseId===exId)?d.editingSession:null}if(page==='exercise'){$('recordtitle').textContent=editingSession?'Editar entrenamiento':'Registrar entrenamiento';$('saverecord').textContent=editingSession?'Guardar cambios':'Guardar entrenamiento';$('canceledit').classList.toggle('hidden',!editingSession);renderTimer()}}
app().addEventListener('input',captureDraft);app().addEventListener('change',captureDraft);
const oldGo=go;go=function(p,g='',id=''){captureDraft();editingSession=null;if(p==='new')editingExercise=false;oldGo(p,g,id)};
const oldRender=render;render=function(){oldRender();enhancePage()};
function enhancePage(){document.querySelectorAll('.footer button').forEach((b,i)=>{const active=i===0?['home','group','exercise','new'].includes(page):page===(i===1?'stats':'settings');if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});app().querySelectorAll('.field').forEach(f=>{const label=f.querySelector('label'),el=f.querySelector('input,select,textarea');if(label&&el){if(!el.id)el.id='field-'+Math.random().toString(36).slice(2);label.htmlFor=el.id}});applyDraft();if(page==='settings')enhanceSettings();if(page==='home'||page==='settings')backupReminder()}
const oldNew=newExercise;newExercise=function(edit=false){editingExercise=edit;oldNew(edit);enhancePage()};
editExercise=function(){captureDraft();page='new';editingSession=null;newExercise(true)};
addSession=async function(){const sets=[0,1,2,3].map(i=>({kg:Number($('kg'+i).value),reps:Number($('reps'+i).value)}));if(sets.some((s,i)=>!$('kg'+i).value.trim()||!$('reps'+i).value.trim()||!Number.isFinite(s.kg)||s.kg<0||!Number.isInteger(s.reps)||s.reps<0)||!$('date').value){notice('Completa los pesos y las repeticiones de las cuatro series con valores válidos.');return}const next=clone(db),old=next.sessions.find(s=>s.id===editingSession);const s={id:old?.id||'s-'+newId(),exerciseId:exId,date:$('date').value,sets,tech:$('tech').value,effort:$('effort').value,note:$('note').value,created:old?.created||Date.now()};if(old)next.sessions[next.sessions.indexOf(old)]=s;else next.sessions.push(s);if(await commit(next)){clearDraft();editingSession=null;render();notice('Entrenamiento guardado · '+recommend(s)+(recommend(s)==='SUBIR'?' · Valora aumentar '+ex().step+' kg si mantienes buena técnica.':''))}};
storeExercise=async function(edit){const next=clone(db),obj={id:edit?exId:'e-'+newId(),group:$('newgroup').value,name:$('newname').value.trim(),min:edit?ex().min:0,max:edit?ex().max:0,step:Number($('newstep').value),rest:Number($('newrest').value),notes:$('newnotes').value};if(['newstep','newrest'].some(id=>!$(id).value.trim())){notice('Completa los datos del ejercicio.');return}if(edit)next.exercises[next.exercises.findIndex(e=>e.id===exId)]=obj;else next.exercises.push(obj);if(await commit(next)){clearDraft();page='exercise';group=obj.group;exId=obj.id;editingSession=null;render();scrollTo(0,0);notice(edit?'Ejercicio actualizado.':'Ejercicio añadido.')}};
function historyCards(ls){return ls.length?ls.map(s=>`<article class="logcard"><div class="row"><b>${fmt(s.date)}</b><span class="tag ${recommend(s)==='REVISAR'?'warning':''}">${recommend(s)}</span></div><div class="setchips">${s.sets.map((x,i)=>`<div class="setchip"><small>Serie ${i+1} · objetivo ${[12,10,8,6][i]}</small>${x.kg} kg × ${x.reps}</div>`).join('')}</div><p class="hint">Técnica: ${s.tech==='OK'?'correcta':'revisar'} · ${s.effort==='Controlado'?'con reserva':'al límite'}</p>${s.note?`<p class="lognote">${esc(s.note)}</p>`:''}<div class="actions"><button class="btn secondary" aria-label="Editar registro del ${fmt(s.date)}" onclick="editSession('${s.id}')">Editar</button><button class="btn danger" aria-label="Eliminar registro del ${fmt(s.date)}" onclick="removeSession('${s.id}')">Eliminar</button></div></article>`).join(''):'<div class="empty">Tu primer registro aparecerá aquí.</div>'}
function editSession(id){captureDraft();const s=db.sessions.find(s=>s.id===id);if(!s)return;editingSession=id;$('date').value=s.date;s.sets.forEach((x,i)=>{$('kg'+i).value=x.kg;$('reps'+i).value=x.reps});$('tech').value=s.tech;$('effort').value=s.effort;$('note').value=s.note;captureDraft();applyDraft();$('registro').scrollIntoView({behavior:'smooth',block:'start'})}
function cancelEdit(){clearDraft();editingSession=null;render();notice('Edición cancelada. El registro original se conserva.')}
async function removeSession(id){if(!await ask('¿Mover este registro a la papelera? Podrás recuperarlo desde Ajustes.'))return;const next=clone(db),index=next.sessions.findIndex(s=>s.id===id);if(index<0)return;next.trash??=[];next.trash.push(next.sessions.splice(index,1)[0]);if(await commit(next)){if(editingSession===id){clearDraft();editingSession=null}render();notice('Registro movido a la papelera. Puedes recuperarlo en Ajustes.')}}
async function recoverSession(id){const next=clone(db),index=(next.trash||[]).findIndex(s=>s.id===id);if(index<0)return;next.sessions.push(next.trash.splice(index,1)[0]);if(await commit(next)){render();notice('Registro recuperado.')}}
chart=function(log){const pts=log.filter(s=>s.sets[3].reps>0).slice(0,15).reverse();if(pts.length<2)return '<p class="hint">Registra dos entrenamientos con repeticiones en la cuarta serie para ver tu evolución.</p>';const vals=pts.map(s=>s.sets[3].kg),min=Math.min(...vals),max=Math.max(...vals),range=max-min;const xy=vals.map((v,i)=>[40+i*260/(vals.length-1),range?120-(v-min)/range*85:77]);return `<svg class="chart" viewBox="0 0 330 170" role="img" aria-label="Peso de la cuarta serie, de ${fmt(pts[0].date)} a ${fmt(pts[pts.length-1].date)}, de ${vals[0]} a ${vals[vals.length-1]} kilos"><path d="M40 25 V130 H305" stroke="#59708e" fill="none"/><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#99e7bb" stroke-width="3"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#b9f6d3"/>`).join('')}<text x="4" y="25">${max} kg</text><text x="4" y="128">${min} kg</text><text x="40" y="153">${fmt(pts[0].date)}</text><text x="300" y="153" text-anchor="end">${fmt(pts[pts.length-1].date)}</text></svg><p class="hint">Últimos ${pts.length} registros · kilos de la cuarta serie, independientemente de sus repeticiones.</p>`};
let timerState=null;try{timerState=JSON.parse(sessionStorage.getItem(KEY+'-timer')||'null')}catch{}
function persistTimer(){try{sessionStorage.setItem(KEY+'-timer',JSON.stringify(timerState))}catch{}}
function remaining(){return timerState?Math.max(0,timerState.end?Math.ceil((timerState.end-Date.now())/1000):timerState.remaining):0}
function startTimer(){timerState={end:Date.now()+(timerState?.paused&&timerState.exerciseId===exId?timerState.remaining:ex().rest)*1000,exerciseId:exId,paused:false};persistTimer();renderTimer()}
function pauseTimer(){if(!timerState)return;timerState={...timerState,remaining:remaining(),end:null,paused:true};persistTimer();renderTimer()}
function resetTimer(){timerState=null;persistTimer();renderTimer()}
function renderTimer(){const holder=$('timer');if(!holder||page!=='exercise')return;const active=timerState?.exerciseId===exId,seconds=active?remaining():ex().rest;const value=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;holder.innerHTML=`<div class="timer-value" role="timer" aria-label="Tiempo de descanso">${value}</div><p class="timer-caption">${active?(seconds===0?'Descanso completado':timerState.paused?'En pausa':'Descansando'):'Duración de la ficha · '+ex().rest+' segundos'}</p><div class="actions"><button class="btn" onclick="${active&&!timerState.paused&&seconds>0?'pauseTimer()':'startTimer()'}">${active&&!timerState.paused&&seconds>0?'Pausar':active&&timerState.paused?'Continuar':'Iniciar descanso'}</button><button class="btn secondary" onclick="resetTimer()">Reiniciar</button></div>`}
setInterval(()=>{if(timerState?.end){const seconds=remaining();if(seconds===0){timerState={...timerState,end:null,remaining:0,paused:false};persistTimer();notice('Descanso completado. Continúa cuando estés preparado.');renderTimer()}else if(page==='exercise'&&timerState.exerciseId===exId){const value=document.querySelector('#timer .timer-value');if(value)value.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}}},1000);
function downloadJSON(data,name){const blob=new Blob([typeof data==='string'?data:JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
const BACKUP_META=KEY+'-backup-status';
function backupStatus(){try{const meta=JSON.parse(localStorage.getItem(BACKUP_META)||'null');if(meta&&Number.isFinite(meta.at)&&typeof meta.snapshot==='string')return meta}catch{}return null}
function backupDue(){if(!db.sessions.length&&!(db.trash||[]).length)return false;const meta=backupStatus();return !meta||(JSON.stringify(db)!==meta.snapshot&&Date.now()-meta.at>=7*86400000)}
function backupReminder(){if(!backupDue()||$('backup-reminder'))return;const card=document.createElement('section');card.id='backup-reminder';card.className='card';card.innerHTML='<h3>Protege tu historial</h3><p class="hint">'+(backupStatus()?'Hay cambios y han pasado al menos 7 días desde la última exportación.':'Todavía no consta una exportación de tu historial en este dispositivo.')+' Exporta una copia y comprueba que se guarde en Archivos.</p><button class="btn secondary full" onclick="backup()">Exportar copia ahora</button>';app().append(card)}
backup=function(){if(storageReadFailed){notice('Usa Descargar recuperación para conservar el almacenamiento original.');return}try{downloadJSON(db,'mi-gimnasio-copia-'+today()+'.json');try{localStorage.setItem(BACKUP_META,JSON.stringify({at:Date.now(),snapshot:JSON.stringify(db)}))}catch{}$('backup-reminder')?.remove();if(page==='settings')updateBackupStatus();notice('Exportación iniciada. Comprueba que el archivo esté guardado en Archivos.')}catch{notice('No se pudo iniciar la descarga de la copia. Inténtalo de nuevo.')}};
function updateBackupStatus(){const el=$('backup-status');if(!el)return;const meta=backupStatus();el.textContent=meta?'Última exportación iniciada: '+new Date(meta.at).toLocaleDateString('es-ES')+'. Comprueba siempre el archivo descargado.':'No consta una exportación en este dispositivo.'}

function recovery(){try{const raw=localStorage.getItem(storageReadFailed?KEY:KEY+'-anterior');if(!raw){notice('Todavía no hay una versión anterior.');return}downloadJSON(raw,'mi-gimnasio-recuperacion-'+today()+'.json')}catch{notice('No se ha podido acceder al almacenamiento.')}}
restore=async function(inp){const file=inp.files?.[0];if(!file)return;try{if(file.size>25000000)throw Error('El archivo supera el límite de 25 MB.');const next=validateDB(JSON.parse(await file.text()));if(!await ask(`La copia contiene ${next.exercises.length} ejercicios y ${next.sessions.length} ${next.sessions.length===1?'registro':'registros'}. Reemplazará tus datos actuales. Se conservará una versión anterior local para recuperación. ¿Continuar?`))return;if(await commit(next,{restore:true})){draftStore={};try{sessionStorage.removeItem(KEY+'-drafts')}catch{}editingSession=null;page='home';render();notice('Copia restaurada y verificada.')}}catch(e){notice('No se pudo restaurar. '+(e.message||'Archivo incompatible.'))}finally{inp.value=''}};
function enhanceSettings(){const status=document.createElement('p');status.className='hint';status.id='backup-status';app().querySelector('.card').append(status);updateBackupStatus();const card=document.createElement('section');card.className='card';card.innerHTML=`<h3>Recuperación local</h3><p class="hint">Se conserva el estado anterior al último guardado en este navegador. No sustituye una copia descargada. ${storageReadFailed?'Se han bloqueado los nuevos guardados para proteger el archivo original.':''}</p><button class="btn secondary full" onclick="recovery()">Descargar recuperación</button><h3 class="spaced">Papelera</h3>${db.trash?.length?db.trash.map(s=>`<div class="logcard"><b>${esc(db.exercises.find(e=>e.id===s.exerciseId)?.name)}</b><p class="hint">${fmt(s.date)}</p><button class="btn secondary" onclick="recoverSession('${s.id}')">Recuperar registro</button></div>`).join(''):'<p class="hint">No hay registros eliminados.</p>'}`;app().append(card);const texts=app().querySelectorAll('.card');texts.forEach(c=>{if(c.querySelector('h3')?.textContent==='Instalar en iPhone')c.innerHTML='<h3>Instalar en iPhone</h3><p class="hint">Abre esta dirección HTTPS en Safari y selecciona Compartir → Añadir a pantalla de inicio. Tras la primera carga completa, podrás volver a abrirla sin conexión. Comprueba el acceso sin conexión y exporta una copia antes de depender de ella.</p><p class="hint" id="offline-status">'+('serviceWorker'in navigator?'Preparando disponibilidad sin conexión…':'Este navegador no permite preparar el acceso sin conexión.')+'</p>';});if('serviceWorker'in navigator)navigator.serviceWorker.ready.then(()=>{$('offline-status')&&($('offline-status').textContent='Acceso sin conexión preparado para este dispositivo. La instalación en iPhone requiere una prueba en Safari.')}).catch(()=>{})}
render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>notice('No se pudo preparar el acceso sin conexión. Puedes seguir usando la app con conexión.'));
